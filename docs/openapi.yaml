components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    Search:
      name: search
      in: query
      required: false
      schema: {type: string}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    Offset:
      name: offset
      in: query
      required: false
      schema: {type: integer, minimum: 0, default: 0}
    HorarioId:
      name: horarioId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    BloqueoId:
      name: bloqueoId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    EspecialidadIdQuery:
      name: especialidad_id
      in: query
      required: false
      schema: {type: integer, format: int64, minimum: 1}
    MedicoIdQuery:
      name: medico_id
      in: query
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    DesdeFecha:
      name: desde
      in: query
      required: false
      description: Fecha local inclusiva en formato YYYY-MM-DD.
      schema: {type: string, format: date}
    HastaFecha:
      name: hasta
      in: query
      required: false
      description: Fecha local inclusiva en formato YYYY-MM-DD.
      schema: {type: string, format: date}
    EstadoCitaQuery:
      name: estado
      in: query
      required: false
      schema:
        type: string
        enum: [programada, confirmada, atendida, no_asistio, cancelada, reprogramada]
    DesdeCita:
      name: desde
      in: query
      required: false
      description: Inicio del rango en RFC 3339.
      schema: {type: string, format: date-time}
    HastaCita:
      name: hasta
      in: query
      required: false
      description: Fin exclusivo del rango en RFC 3339.
      schema: {type: string, format: date-time}

  schemas:
    JsonObject:
      type: object
      additionalProperties: true

    Envelope:
      type: object
      required: [data]
      properties:
        data: {}

    ListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {}
        meta:
          type: object
          properties:
            limit: {type: integer}
            offset: {type: integer}
            count: {type: integer}

    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string, example: validation_error}
        message: {type: string}

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/Error'}
        request_id: {type: string}

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string, format: password}

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: {type: string}

    ChangePasswordRequest:
      type: object
      required: [password_actual, password_nueva]
      properties:
        password_actual: {type: string, format: password}
        password_nueva: {type: string, format: password, minLength: 12}

    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: {type: string}
        refresh_token: {type: string}
        token_type: {type: string, example: Bearer}
        expires_in: {type: integer, format: int64, example: 900}
        usuario: {$ref: '#/components/schemas/Usuario'}

    TokenPairEnvelope:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/TokenPair'}

    Usuario:
      type: object
      properties:
        id: {type: integer, format: int64}
        username: {type: string}
        email: {type: string, format: email}
        nombres: {type: string}
        apellidos: {type: string}
        activo: {type: boolean}
        email_verificado: {type: boolean}
        roles: {type: array, items: {type: string}}
        permisos: {type: array, items: {type: string}}
        paciente_id: {type: integer, format: int64}
        medico_id: {type: integer, format: int64}
        version: {type: integer, format: int64}

    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
        - nombres
        - apellidos
        - tipo_documento
        - numero_documento
        - fecha_nacimiento
        - acepta_terminos
        - version_terminos
      properties:
        username: {type: string}
        email: {type: string, format: email}
        password: {type: string, format: password, minLength: 12}
        nombres: {type: string}
        apellidos: {type: string}
        tipo_documento: {type: string, example: CEDULA}
        numero_documento: {type: string}
        fecha_nacimiento: {type: string, format: date, example: '1990-05-12'}
        sexo: {type: string}
        telefono: {type: string}
        direccion: {type: string}
        acepta_terminos: {type: boolean}
        version_terminos: {type: string, example: '2026-10'}

    RegisterResponseEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            usuario_id: {type: integer, format: int64}
            paciente_id: {type: integer, format: int64}
            solicitud_id: {type: integer, format: int64}
            email: {type: string, format: email}
            email_verificado: {type: boolean}
            vinculacion_pendiente: {type: boolean}
            mensaje: {type: string}

    TokenRequest:
      type: object
      required: [token]
      properties:
        token: {type: string}

    EmailRequest:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email}

    ResetPasswordRequest:
      type: object
      required: [token, password_nueva]
      properties:
        token: {type: string}
        password_nueva: {type: string, format: password, minLength: 12}

    EspecialidadRequest:
      type: object
      required: [codigo, nombre]
      properties:
        codigo: {type: string, maxLength: 20, example: MED-GEN}
        nombre: {type: string, maxLength: 120}
        descripcion: {type: string}
        requiere_derivacion: {type: boolean, default: true}
        activa: {type: boolean, default: true}
        orden: {type: integer, default: 0}
        duracion_cita_min: {type: integer, minimum: 5, maximum: 240, default: 30}
        version: {type: integer, format: int64}

    PersonaRequest:
      type: object
      required: [tipo_documento, numero_documento, nombres, apellidos]
      properties:
        tipo_documento: {type: string, example: CEDULA}
        numero_documento: {type: string}
        nombres: {type: string}
        apellidos: {type: string}
        fecha_nacimiento: {type: string, format: date}
        sexo: {type: string}
        telefono: {type: string}
        email: {type: string, format: email}
        direccion: {type: string}

    PacienteRequest:
      type: object
      required: [persona]
      properties:
        persona: {$ref: '#/components/schemas/PersonaRequest'}
        grupo_sanguineo: {type: string}
        factor_rh: {type: string}
        contacto_emergencia_nombre: {type: string}
        contacto_emergencia_telefono: {type: string}
        version: {type: integer, format: int64}

    MedicoRequest:
      type: object
      required: [persona, especialidad_id, numero_licencia]
      properties:
        persona: {$ref: '#/components/schemas/PersonaRequest'}
        especialidad_id: {type: integer, format: int64}
        numero_licencia: {type: string}
        tipo_profesional: {type: string}
        duracion_cita_min: {type: integer, minimum: 5, maximum: 240, default: 30}
        bio: {type: string, maxLength: 2000}
        foto_url: {type: string, format: uri, maxLength: 500}
        acepta_portal: {type: boolean, default: true}
        version: {type: integer, format: int64}

    HorarioRequest:
      type: object
      required: [dia_semana, hora_inicio, hora_fin]
      properties:
        dia_semana:
          type: integer
          minimum: 1
          maximum: 7
          description: 1 = lunes, 7 = domingo.
        hora_inicio: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '09:00'}
        hora_fin: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '12:00'}
        duracion_slot_min: {type: integer, minimum: 5, maximum: 240, default: 30}
        vigente_desde: {type: string, format: date, description: 'En creación, por defecto la fecha local actual; en actualización, ausente conserva el valor.'}
        vigente_hasta: {type: string, format: date, description: 'En creación, vacío o ausente significa vigencia indefinida; en actualización, vacío la limpia y ausente conserva el valor.'}
        activo: {type: boolean, default: true}
        version: {type: integer, format: int64, description: Obligatorio para detectar actualizaciones concurrentes en PUT.}

    BloqueoRequest:
      type: object
      required: [inicio, fin, motivo]
      properties:
        inicio: {type: string, format: date-time}
        fin: {type: string, format: date-time}
        motivo: {type: string, minLength: 1, maxLength: 500}

    Horario:
      type: object
      properties:
        id: {type: integer, format: int64}
        medico_id: {type: integer, format: int64}
        dia_semana: {type: integer, minimum: 1, maximum: 7}
        hora_inicio: {type: string}
        hora_fin: {type: string}
        duracion_slot_min: {type: integer}
        vigente_desde: {type: string, format: date}
        vigente_hasta: {type: string, format: date}
        activo: {type: boolean}
        version: {type: integer, format: int64}

    Bloqueo:
      type: object
      properties:
        id: {type: integer, format: int64}
        medico_id: {type: integer, format: int64}
        inicio: {type: string, format: date-time}
        fin: {type: string, format: date-time}
        motivo: {type: string}
        creado_por: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}

    EspecialidadPortal:
      type: object
      properties:
        id: {type: integer, format: int64}
        codigo: {type: string}
        nombre: {type: string}
        descripcion: {type: string}
        requiere_derivacion: {type: boolean}
        duracion_cita_min: {type: integer}

    MedicoPortal:
      type: object
      properties:
        id: {type: integer, format: int64}
        nombres: {type: string}
        apellidos: {type: string}
        especialidad: {$ref: '#/components/schemas/EspecialidadPortal'}
        duracion_cita_min: {type: integer}
        bio: {type: string}
        foto_url: {type: string}

    SlotDisponible:
      type: object
      properties:
        inicio: {type: string, format: date-time, description: Instante UTC.}
        fin: {type: string, format: date-time, description: Instante UTC.}
        duracion_min: {type: integer}

    Disponibilidad:
      type: object
      properties:
        medico_id: {type: integer, format: int64}
        especialidad_id: {type: integer, format: int64}
        zona_horaria: {type: string, example: America/Guayaquil}
        desde: {type: string, format: date}
        hasta: {type: string, format: date}
        slots:
          type: array
          items: {$ref: '#/components/schemas/SlotDisponible'}

    PortalCitaRequest:
      type: object
      required: [medico_id, fecha_hora_inicio]
      properties:
        medico_id: {type: integer, format: int64, minimum: 1}
        fecha_hora_inicio:
          type: string
          format: date-time
          description: Debe coincidir exactamente con un slot generado por /portal/disponibilidad.
        tipo: {type: string, enum: [primera_vez, control, telemedicina], default: primera_vez}
        motivo: {type: string, maxLength: 1000}
        derivacion_id:
          type: integer
          format: int64
          minimum: 1
          description: Obligatorio para especialidades con requiere_derivacion=true; prohibido para acceso directo.

    PortalCitaReprogramarRequest:
      type: object
      required: [fecha_hora_inicio, version]
      properties:
        fecha_hora_inicio:
          type: string
          format: date-time
          description: Nuevo slot; no se permite cambiar paciente, médico ni especialidad.
        motivo: {type: string, maxLength: 1000}
        version:
          type: integer
          format: int64
          description: Versión leída de la cita. Puede ser 0 para citas recién creadas.

    CancelarCitaRequest:
      type: object
      properties:
        motivo: {type: string, maxLength: 500}

    NotaCitaRequest:
      type: object
      properties:
        motivo: {type: string, maxLength: 5000}
        evaluacion: {type: string, maxLength: 5000}
        plan: {type: string, maxLength: 5000}
        version: {type: integer, format: int64, description: Obligatorio para actualizar una nota existente.}

    DerivacionRequest:
      type: object
      required: [especialidad_destino_id, motivo]
      properties:
        especialidad_destino_id: {type: integer, format: int64, minimum: 1}
        medico_destino_id: {type: integer, format: int64, minimum: 1}
        motivo: {type: string, minLength: 1, maxLength: 2000}
        prioridad: {type: string, enum: [normal, preferente, urgente], default: normal}

    TransferirPacienteRequest:
      type: object
      required: [medico_destino_id, motivo, version]
      properties:
        medico_destino_id: {type: integer, format: int64, minimum: 1}
        motivo: {type: string, minLength: 1, maxLength: 1000}
        version: {type: integer, format: int64}

    NotaCita:
      type: object
      properties:
        id: {type: integer, format: int64}
        cita_id: {type: integer, format: int64}
        medico_id: {type: integer, format: int64}
        motivo: {type: string}
        evaluacion: {type: string}
        plan: {type: string}
        version: {type: integer, format: int64}

    Derivacion:
      type: object
      properties:
        id: {type: integer, format: int64}
        paciente_id: {type: integer, format: int64}
        paciente_nombre: {type: string}
        medico_origen_id: {type: integer, format: int64}
        cita_origen_id: {type: integer, format: int64}
        especialidad_destino_id: {type: integer, format: int64}
        especialidad_destino: {type: string}
        medico_destino_id: {type: integer, format: int64}
        motivo: {type: string}
        prioridad: {type: string, enum: [normal, preferente, urgente]}
        estado: {type: string, enum: [pendiente, agendada, atendida, vencida, cancelada]}
        vigente_desde: {type: string, format: date-time}
        vigente_hasta: {type: string, format: date-time}
        version: {type: integer, format: int64}

    TransferenciaPaciente:
      type: object
      properties:
        id: {type: integer, format: int64}
        paciente_id: {type: integer, format: int64}
        medico_anterior_id: {type: integer, format: int64}
        medico_nuevo_id: {type: integer, format: int64}
        motivo: {type: string}
        creada_por_usuario_id: {type: integer, format: int64}
        created_at: {type: string, format: date-time}

    PreferenciasNotificacionRequest:
      type: object
      required: [email_habilitado, recordatorios_habilitados]
      properties:
        email_habilitado: {type: boolean}
        recordatorios_habilitados: {type: boolean}

    CitaRequest:
      type: object
      required: [paciente_id, medico_id, fecha_hora_inicio, duracion_min]
      properties:
        paciente_id: {type: integer, format: int64}
        medico_id: {type: integer, format: int64}
        fecha_hora_inicio: {type: string, format: date-time}
        duracion_min: {type: integer, minimum: 1}
        tipo: {type: string}
        motivo: {type: string}
        estado: {type: string, enum: [programada, confirmada, atendida, no_asistio, cancelada, reprogramada]}
        version: {type: integer, format: int64}

    CambiarEstadoRequest:
      type: object
      required: [estado]
      properties:
        estado: {type: string, enum: [programada, confirmada, atendida, no_asistio, cancelada, reprogramada]}

    PerfilUpdateRequest:
      type: object
      properties:
        telefono: {type: string}
        direccion: {type: string}
        contacto_emergencia_nombre: {type: string}
        contacto_emergencia_telefono: {type: string}
        version: {type: integer, format: int64, description: Opcional; 0 significa sin control de versión}

    VincularPacienteRequest:
      type: object
      required: [paciente_id, usuario_id]
      properties:
        paciente_id: {type: integer, format: int64}
        usuario_id: {type: integer, format: int64}

    VincularMedicoRequest:
      type: object
      required: [medico_id, usuario_id]
      properties:
        medico_id: {type: integer, format: int64}
        usuario_id: {type: integer, format: int64}

    UsuarioCreateRequest:
      type: object
      required: [username, email, nombres, apellidos, password, roles]
      properties:
        username: {type: string}
        email: {type: string, format: email}
        nombres: {type: string}
        apellidos: {type: string}
        password: {type: string, format: password, minLength: 12}
        roles: {type: array, items: {type: string}}

    UsuarioUpdateRequest:
      type: object
      required: [version]
      properties:
        email: {type: string, format: email}
        nombres: {type: string}
        apellidos: {type: string}
        activo: {type: boolean}
        roles: {type: array, items: {type: string}}
        password: {type: string, format: password}
        version: {type: integer, format: int64}

  responses:
    Ok:
      description: Operación exitosa
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Envelope'}
    Created:
      description: Recurso creado
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Envelope'}
    NoContent:
      description: Sin contenido
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthorized:
      description: No autenticado o token inválido
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Forbidden:
      description: Sin permiso, email no verificado o recurso ajeno
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: Conflicto de negocio o de versión
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Locked:
      description: Cuenta bloqueada temporalmente
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    TooManyRequests:
      description: Límite de solicitudes excedido
      headers:
        Retry-After:
          description: Segundos recomendados antes de reintentar.
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}

x-pendientes: []
