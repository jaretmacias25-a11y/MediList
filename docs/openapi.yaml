openapi: 3.1.0
info:
  title: MediList API
  version: 0.10.0
  description: |
    Contrato de los endpoints implementados hasta la Fase 9. El roadmap de
    endurecimiento y despliegue está en doc.md y docs/runbook.md.

    Convenciones:
    - Respuestas exitosas: {"data": ...} o {"data": [...], "meta": {...}}.
    - Errores: {"error": {"code": "...", "message": "..."}, "request_id": "..."}.
    - Fechas y horas en RFC 3339; la base de datos persiste en UTC.
    - El paciente y el médico se resuelven desde la sesión, nunca desde el body.
servers:
  - url: http://localhost:8080
    description: API local
security:
  - bearerAuth: []
tags:
  - name: Salud
  - name: Autenticación
  - name: Catálogo
  - name: Pacientes
  - name: Médicos
  - name: Agenda
  - name: Citas
  - name: Portal paciente
  - name: Portal médico
  - name: Cuentas
  - name: Usuarios
  - name: Auditoría
  - name: Errores

paths:
  /health:
    get:
      tags: [Salud]
      summary: Estado de la API y la base de datos
      security: []
      responses:
        '200':
          description: API y base de datos disponibles
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
                  database: {type: string, example: up}
        '503':
          description: Base de datos no disponible
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: degraded}
                  database: {type: string, example: down}

  /metrics:
    get:
      tags: [Salud]
      summary: Métricas Prometheus de operación
      description: |
        Contadores sin etiquetas de usuario. En producción debe exponerse solo
        a la red del recolector de métricas.
      security: []
      responses:
        '200':
          description: Texto en formato Prometheus
          content:
            text/plain:
              schema: {type: string}

  /api/v1/auth/login:
    post:
      tags: [Autenticación]
      summary: Inicia sesión con username y contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Tokens y datos del usuario
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenPairEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '423': {$ref: '#/components/responses/Locked'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /api/v1/auth/refresh:
    post:
      tags: [Autenticación]
      summary: Rota el refresh token y emite un nuevo par de tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '200':
          description: Nuevo par de tokens
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenPairEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/auth/logout:
    post:
      tags: [Autenticación]
      summary: Revoca el refresh token actual
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/BadRequest'}

  /api/v1/auth/me:
    get:
      tags: [Autenticación]
      summary: Devuelve el actor actual, sus roles, permisos y vínculos
      responses:
        '200':
          description: Datos de la cuenta y vínculos activos
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /api/v1/auth/password:
    post:
      tags: [Autenticación]
      summary: Cambia la contraseña de la cuenta autenticada
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /api/v1/auth/register:
    post:
      tags: [Autenticación]
      summary: Registro público de paciente
      description: |
        Crea una cuenta pendiente y, si el documento ya existe, una solicitud de
        vinculación sin duplicar la historia clínica. No emite tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201':
          description: Cuenta creada; requiere verificación de email
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegisterResponseEnvelope'}
        '202':
          description: Cuenta creada con solicitud de vinculación pendiente
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegisterResponseEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /api/v1/auth/verify-email:
    post:
      tags: [Autenticación]
      summary: Verifica el email con un token de un solo uso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenRequest'}
      responses:
        '200':
          description: Email verificado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '400': {$ref: '#/components/responses/BadRequest'}

  /api/v1/auth/resend-verification:
    post:
      tags: [Autenticación]
      summary: Reenvía el correo de verificación
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailRequest'}
      responses:
        '200':
          description: Respuesta genérica
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /api/v1/auth/forgot-password:
    post:
      tags: [Autenticación]
      summary: Solicita el restablecimiento de contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmailRequest'}
      responses:
        '200':
          description: Respuesta genérica
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /api/v1/auth/reset-password:
    post:
      tags: [Autenticación]
      summary: Restablece la contraseña con un token de un solo uso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '200':
          description: Contraseña restablecida
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '400': {$ref: '#/components/responses/BadRequest'}

  /api/v1/especialidades:
    get:
      tags: [Catálogo]
      summary: Lista especialidades
      parameters:
        - {$ref: '#/components/parameters/Search'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListEnvelope'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Catálogo]
      summary: Crea una especialidad
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EspecialidadRequest'}
      responses:
        '201':
          description: Especialidad creada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/v1/especialidades/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Catálogo]
      summary: Obtiene una especialidad
      responses:
        '200':
          description: Especialidad
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Catálogo]
      summary: Actualiza una especialidad
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EspecialidadRequest'}
      responses:
        '200':
          description: Especialidad actualizada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [Catálogo]
      summary: Elimina una especialidad si no está referenciada
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v1/pacientes:
    get:
      tags: [Pacientes]
      summary: Lista pacientes (solo personal administrativo)
      parameters:
        - {$ref: '#/components/parameters/Search'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListEnvelope'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Pacientes]
      summary: Crea persona y paciente en una transacción
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PacienteRequest'}
      responses:
        '201':
          description: Paciente creado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v1/pacientes/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Pacientes]
      summary: Obtiene un paciente (solo personal administrativo)
      responses:
        '200':
          description: Paciente
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Pacientes]
      summary: Actualiza un paciente con control de versión
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PacienteRequest'}
      responses:
        '200':
          description: Paciente actualizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [Pacientes]
      summary: Desactiva un paciente
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v1/pacientes/{id}/transferir:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Pacientes]
      summary: Transfiere el paciente a otro médico tratante
      description: Solo admin/recepción con pacientes:transferir.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransferirPacienteRequest'}
      responses:
        '200':
          description: Transferencia registrada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v1/pacientes/{id}/transferencias:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Pacientes]
      summary: Lista el historial de transferencias del paciente
      responses:
        '200':
          description: Historial de transferencias
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListEnvelope'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/medicos:
    get:
      tags: [Médicos]
      summary: Lista médicos
      parameters:
        - {$ref: '#/components/parameters/Search'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListEnvelope'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Médicos]
      summary: Crea un médico
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MedicoRequest'}
      responses:
        '201':
          description: Médico creado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v1/medicos/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Médicos]
      summary: Obtiene un médico
      responses:
        '200':
          description: Médico
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Médicos]
      summary: Actualiza un médico con control de versión
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MedicoRequest'}
      responses:
        '200':
          description: Médico actualizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [Médicos]
      summary: Desactiva un médico
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/medicos/{id}/horarios:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Agenda]
      summary: Lista los horarios recurrentes del médico
      description: Incluye horarios activos e inactivos para revisión administrativa.
      responses:
        '200':
          description: Horarios del médico
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListEnvelope'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Agenda]
      summary: Crea un horario recurrente
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HorarioRequest'}
      responses:
        '201':
          description: Horario creado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v1/medicos/{id}/horarios/{horarioId}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - {$ref: '#/components/parameters/HorarioId'}
    put:
      tags: [Agenda]
      summary: Actualiza un horario con control de versión
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HorarioRequest'}
      responses:
        '200':
          description: Horario actualizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [Agenda]
      summary: Desactiva un horario (baja lógica)
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/medicos/{id}/bloqueos:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Agenda]
      summary: Lista bloqueos de agenda del médico
      parameters:
        - {$ref: '#/components/parameters/DesdeFecha'}
        - {$ref: '#/components/parameters/HastaFecha'}
      responses:
        '200':
          description: Bloqueos que se cruzan con el rango
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListEnvelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Agenda]
      summary: Crea un bloqueo puntual en UTC
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BloqueoRequest'}
      responses:
        '201':
          description: Bloqueo creado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v1/medicos/{id}/bloqueos/{bloqueoId}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - {$ref: '#/components/parameters/BloqueoId'}
    put:
      tags: [Agenda]
      summary: Actualiza un bloqueo de agenda
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BloqueoRequest'}
      responses:
        '200':
          description: Bloqueo actualizado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [Agenda]
      summary: Elimina un bloqueo de agenda
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/citas:
    get:
      tags: [Citas]
      summary: Lista citas (solo personal administrativo)
      parameters:
        - {$ref: '#/components/parameters/Search'}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Offset'}
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListEnvelope'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Citas]
      summary: Crea una cita desde administración
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CitaRequest'}
      responses:
        '201':
          description: Cita creada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409':
          description: Solapamiento, derivación requerida o conflicto de versión
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                requiereDerivacion:
                  value:
                    error:
                      code: requiere_derivacion
                      message: La especialidad requiere una derivación vigente
                    request_id: 7f3c2a9e

  /api/v1/citas/{id}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    get:
      tags: [Citas]
      summary: Obtiene una cita (solo personal administrativo)
      responses:
        '200':
          description: Cita
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Citas]
      summary: Reprograma o actualiza una cita con control de versión
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CitaRequest'}
      responses:
        '200':
          description: Cita actualizada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [Citas]
      summary: Cancela/elimina una cita
      responses:
        '204': {$ref: '#/components/responses/NoContent'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v1/citas/{id}/sobrescribir-derivacion:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    post:
      tags: [Citas]
      summary: Registra una excepción administrativa de derivación
      description: Solo admin con derivaciones:sobrescribir. No crea una derivación falsa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: {type: string, minLength: 1, maxLength: 2000}
      responses:
        '200':
          description: Excepción registrada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v1/citas/{id}/estado:
    parameters:
      - {$ref: '#/components/parameters/Id'}
    patch:
      tags: [Citas]
      summary: Cambia el estado de una cita
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CambiarEstadoRequest'}
      responses:
        '200':
          description: Cita actualizada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v1/portal/perfil:
    get:
      tags: [Portal paciente]
      summary: Perfil del paciente autenticado
      responses:
        '200':
          description: Paciente y cuenta vinculada
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Envelope'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [Portal paciente]
      summary: Actualiza teléfono, dirección y contacto de emergencia
      description: No acepta documento, email de cuenta ni datos clínicos.
      requestBody:
        required: true
        content:
