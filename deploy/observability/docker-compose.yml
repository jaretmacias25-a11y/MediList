name: medilist-observability

services:
  loki:
    image: grafana/loki:3.4.2
    container_name: medilist-loki
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    restart: unless-stopped
    networks:
      - observability

  promtail:
    image: grafana/promtail:3.4.2
    container_name: medilist-promtail
    command: -config.file=/etc/promtail/config.yml
    ports:
      - "9080:9080"
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ../../logs:/var/log/medilist:ro
      - promtail-positions:/positions
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - observability

  grafana:
    image: grafana/grafana:11.6.0
    container_name: medilist-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-medilist-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ALERTING_ENABLED: "true"
      GF_UNIFIED_ALERTING_ENABLED: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - observability

  # Reemplaza este receptor por Slack, Teams, PagerDuty o el webhook real.
  # Se incluye para verificar las notificaciones sin credenciales externas.
  alert-sink:
    image: mendhak/http-https-echo:latest
    container_name: medilist-alert-sink
    ports:
      - "8081:8080"
    restart: unless-stopped
    networks:
      - observability

volumes:
  loki-data:
  promtail-positions:
  grafana-data:

networks:
  observability:
    name: medilist-observability
