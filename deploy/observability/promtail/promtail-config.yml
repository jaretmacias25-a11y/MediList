server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:
  - job_name: medilist-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: medilist-api
          __path__: /var/log/medilist/*.jsonl
    pipeline_stages:
      - json:
          expressions:
            time: time
            level: level
            service: service
            env: env
            instance: instance
      - labels:
          level:
          service:
          env:
          instance:
      - timestamp:
          source: time
          format: RFC3339Nano
